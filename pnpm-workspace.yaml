# SPDX-License-Identifier: AGPL-3.0-or-later
packages:
  - apps/*
  - packages/*
# pnpm 11 reads settings from this file, not .npmrc.
engineStrict: true
autoInstallPeers: false
# Node is provisioned by pnpm itself via package.json devEngines.runtime
# (onFail: download); no .node-version / version manager needed.
allowBuilds:
  esbuild: true
  workerd: true
# vite-plus pins oxlint/oxfmt exactly; ultracite floats. Without these overrides
# two oxlint copies get installed and the ultracite presets' OxlintConfig type no
# longer matches vite-plus's defineConfig (TS2769 in vite.config.ts). The pinned
# versions are vite-plus@0.3.3's own dependency pins — bump all three together.
#
# vite-plus-core is a fork of vite: a third-party Vite plugin (e.g.
# @sveltejs/vite-plugin-svelte) that declares a `vite` peer otherwise resolves the
# real `vite` package, splitting the graph into two structurally similar but
# nominally distinct Plugin/UserConfig types. Redirecting the peer to the same
# vite-plus-core release unifies the types.
#
# @cloudflare/vitest-pool-workers@0.22.0 pins its own bundled miniflare/workerd
# to 5.20260815.0-alpha / 1.20260815.1 — older than the compatibility date
# apps/api's Worker ships with (wrangler.jsonc's compatibility_date). Without
# these overrides the test harness's bundled runtime can't start a Worker on
# that date ("newest date supported by this server binary is 2026-08-22"),
# which would otherwise force the *shipped* compatibility date down to match a
# *test-only* limitation. Forcing the pool onto the newer miniflare/workerd
# already resolved elsewhere in the tree (via wrangler's own dependency) lets
# the Worker's compatibility date stay current. Drop these once
# @cloudflare/vitest-pool-workers ships a release bundling a newer runtime.
overrides:
  oxlint: '=1.83.0'
  oxfmt: '=0.68.0'
  vite@*: npm:@voidzero-dev/vite-plus-core@0.3.3
  miniflare: 5.20260926.0-alpha
  workerd: 1.20260926.1
  '@cloudflare/workerd-darwin-64': 1.20260926.1
  '@cloudflare/workerd-darwin-arm64': 1.20260926.1
  '@cloudflare/workerd-linux-64': 1.20260926.1
  '@cloudflare/workerd-linux-arm64': 1.20260926.1
  '@cloudflare/workerd-windows-64': 1.20260926.1
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # ultracite@7.12.1 is the version pinned in the Task 1 brief (^7.12.1); it was
  # published within the minimumReleaseAge window at install time, so it must be
  # excluded explicitly rather than lowering the global cutoff.
  - ultracite@7.12.1
  # The apps/api Task 3 brief pins wrangler@^4.142.0 and
  # @cloudflare/workers-types@^5.20260928.1; both, and the workerd/miniflare
  # releases wrangler pulls in transitively, were published within the
  # minimumReleaseAge window at install time, so they must be excluded
  # explicitly rather than lowering the global cutoff.
  - wrangler@4.142.0
  - '@cloudflare/workers-types@5.20260928.1'
  - workerd@1.20260926.1
  - '@cloudflare/workerd-darwin-64@1.20260926.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260926.1'
  - '@cloudflare/workerd-linux-64@1.20260926.1'
  - '@cloudflare/workerd-linux-arm64@1.20260926.1'
  - '@cloudflare/workerd-windows-64@1.20260926.1'
  - miniflare@5.20260926.0-alpha
